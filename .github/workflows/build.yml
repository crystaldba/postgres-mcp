name: Postgres MCP CI

# Fast tier (PRs and pushes to main): Postgres 15 and 19 only.
# Full tier (all versions): version tags, manual run, and a daily schedule that
# skips itself when this exact commit already passed a full run (scheduled,
# manual, or tag). A failed full run is retried on the next daily run.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "**/README.md"
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "**/README.md"
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.plan.outputs.run }}
      versions: ${{ steps.plan.outputs.versions }}
    steps:
      - name: Decide which Postgres versions to test
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          full='["12","15","16","17","18","19"]'
          fast='["15","19"]'
          run=true
          case "${{ github.event_name }}" in
            schedule)
              versions="$full"
              # Count earlier successful full runs (schedule, manual, or tag) of this exact commit.
              # If the lookup fails, fall through and run: failing open is safer than skipping.
              covered=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --status success --limit 100 \
                --json event,headBranch,headSha \
                --jq '[.[] | select(.event=="schedule" or .event=="workflow_dispatch" or (.event=="push" and (.headBranch|startswith("v")))) | select(.headSha==env.SHA)] | length' \
                || echo 0)
              if [ "${covered:-0}" -gt 0 ]; then
                echo "Commit $SHA already passed a full run; skipping the daily full run."
                run=false
              fi
              ;;
            workflow_dispatch) versions="$full" ;;
            push)
              if [ "${{ github.ref_type }}" = "tag" ]; then versions="$full"; else versions="$fast"; fi
              ;;
            *) versions="$fast" ;;
          esac
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  lint:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.9"

      - name: Build
        run: uv sync

      - name: Run Lint
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Run Check
        run: uv run pyright

  test:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ${{ fromJSON(needs.plan.outputs.versions) }}
    name: test (postgres ${{ matrix.pg }})
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start Docker service
        run: sudo service docker start || true

      - name: Verify Docker is running
        run: docker info

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.9"

      - name: Build
        run: uv sync

      - name: Run Tests
        env:
          PG_TEST_VERSIONS: ${{ matrix.pg }}
          # Fail instead of skip when Docker, an image build, or an extension is unavailable.
          PG_TEST_STRICT: "1"
        run: uv run pytest -v --log-cli-level=INFO
